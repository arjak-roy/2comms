version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hrms_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrms_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      # Initialize the schema on first run
      - ./db-init.sql:/docker-entrypoint-initdb.d/init.sql
      # Persist data even if container is deleted
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-admin}", "-d", "${POSTGRES_DB:-hrms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  api:
    image: api:latest    
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-hrms_db}  
volumes:
  postgres_data: